<svg xmlns="http://www.w3.org/2000/svg" viewBox="-360 0 1400 400" width="100%" height="100%" role="img" aria-label="Antes de 1989 notaciones fragmentadas; línea de tiempo de UML: 1989 OMG, 1995-1997 unificación, 1997 UML 1.1, 2005 UML 2.0, 2017 UML 2.5.1">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c4a8a"></path>
    </marker>
  </defs>

  <!-- Panel ANTES DE 1989 -->
  <g>
    <rect x="-340" y="90" width="270" height="250" rx="12" fill="#ffffff" stroke="#6c757d" stroke-width="2" stroke-dasharray="6 4"></rect>
    <rect x="-340" y="90" width="270" height="40" rx="12" fill="#6c757d"></rect>
    <rect x="-340" y="114" width="270" height="16" fill="#6c757d"></rect>
    <text x="-205" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">ANTES DE 1989</text>
    <text x="-205" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-style="italic" fill="#6c757d">Notaciones fragmentadas, sin estándar</text>

    <rect x="-322" y="176" width="234" height="58" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <text x="-304" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">1970s · Análisis estructurado</text>
    <text x="-304" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6c757d">DFD, entidad-relación, HIPO, Jackson</text>

    <rect x="-322" y="242" width="234" height="58" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <text x="-304" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">1980s · Métodos orientados a objetos</text>
    <text x="-304" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6c757d">Booch, OMT (Rumbaugh), OOSE (Jacobson)</text>

    <text x="-205" y="324" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6c757d">Cada método usaba su propia notación:</text>
    <text x="-205" y="338" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6c757d">los modelos no se podían compartir entre equipos.</text>
  </g>

  <line x1="-70" y1="210" x2="976" y2="210" stroke="#2c4a8a" stroke-width="3" marker-end="url(#arrow)"></line>

  <!-- Nodo 1989 -->
  <circle cx="68" cy="210" r="12" fill="#2c4a8a" stroke="#fff" stroke-width="3"></circle>
  <text x="68" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c4a8a">1989</text>
  <text x="68" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Nace la OMG</text>
  <text x="68" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6c757d">Consorcio de estándares;
    <tspan x="68" dy="15">UML será su especificación más conocida</tspan>
  </text>

  <!-- Nodo 1995-97 -->
  <circle cx="296" cy="210" r="12" fill="#2c4a8a" stroke="#fff" stroke-width="3"></circle>
  <text x="296" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c4a8a">1995–97</text>
  <text x="296" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Los «tres amigos»</text>
  <text x="296" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6c757d">Unificación de Booch (OOD),
    <tspan x="296" dy="15">OMT (Rumbaugh) y OOSE (Jacobson)</tspan>
  </text>

  <!-- Nodo 1997 -->
  <circle cx="524" cy="210" r="12" fill="#2c4a8a" stroke="#fff" stroke-width="3"></circle>
  <text x="524" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c4a8a">1997</text>
  <text x="524" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">UML 1.1</text>
  <text x="524" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6c757d">Aprobado como estándar
    <tspan x="524" dy="15">por la OMG</tspan>
  </text>

  <!-- Nodo 2005 -->
  <circle cx="752" cy="210" r="12" fill="#2c4a8a" stroke="#fff" stroke-width="3"></circle>
  <text x="752" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c4a8a">2005</text>
  <text x="752" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">UML 2.0</text>
  <text x="752" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6c757d">De 9 a 13 diagramas;
    <tspan x="752" dy="15">más integración con Agile</tspan>
  </text>

  <!-- Nodo 2017 -->
  <circle cx="956" cy="210" r="12" fill="#2c4a8a" stroke="#fff" stroke-width="3"></circle>
  <text x="956" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c4a8a">2017</text>
  <text x="956" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">UML 2.5.1</text>
  <text x="956" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6c757d">Versión formal vigente
    <tspan x="956" dy="15">de la especificación</tspan>
  </text>

  <text x="500" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#6c757d">De la falta de estandarización al lenguaje unificado de modelado (OMG)</text>
</svg>
