<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" role="img" aria-label="Taxonomía de los 14 diagramas UML: 7 estructurales y 7 de comportamiento">
  <defs>
    <marker id="t1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c4a8a"></path>
    </marker>
  </defs>

  <!-- Raíz UML -->
  <rect x="410" y="20" width="180" height="46" rx="10" fill="#2c4a8a"></rect>
  <text x="500" y="49" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">UML</text>
  <line x1="500" y1="66" x2="500" y2="96" stroke="#2c4a8a" stroke-width="2.5"></line>
  <line x1="280" y1="96" x2="720" y2="96" stroke="#2c4a8a" stroke-width="2.5"></line>
  <line x1="280" y1="96" x2="280" y2="120" stroke="#2c4a8a" stroke-width="2.5" marker-end="url(#t1)"></line>
  <line x1="720" y1="96" x2="720" y2="120" stroke="#2c4a8a" stroke-width="2.5" marker-end="url(#t1)"></line>

  <!-- Panel estructurales -->
  <rect x="30" y="120" width="470" height="360" rx="12" fill="#ffffff" stroke="#2c4a8a" stroke-width="2"></rect>
  <rect x="30" y="120" width="470" height="46" rx="12" fill="#2c4a8a"></rect>
  <rect x="30" y="148" width="470" height="18" fill="#2c4a8a"></rect>
  <text x="265" y="149" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ESTRUCTURALES · 7</text>
  <text x="265" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-style="italic" fill="#6c757d">Aspectos estáticos del sistema</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="206" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="84" cy="223" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="84" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">1</text>
    <text x="104" y="227" font-size="13" font-weight="700" fill="#1a1a1a">Clases</text>
    <text x="104" y="239" font-size="10" fill="#6c757d">la base de toda solución orientada a objetos</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="246" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="84" cy="263" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="84" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">2</text>
    <text x="104" y="267" font-size="13" font-weight="700" fill="#1a1a1a">Componentes</text>
    <text x="104" y="279" font-size="10" fill="#6c757d">sistemas complejos; comunicación por interfaces</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="286" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="84" cy="303" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="84" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">3</text>
    <text x="104" y="307" font-size="13" font-weight="700" fill="#1a1a1a">Estructura compuesta</text>
    <text x="104" y="319" font-size="10" fill="#6c757d">estructura interna de una clase</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="326" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="84" cy="343" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="84" y="347" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">4</text>
    <text x="104" y="347" font-size="13" font-weight="700" fill="#1a1a1a">Despliegue</text>
    <text x="104" y="359" font-size="10" fill="#6c757d">hardware y software; múltiples máquinas</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="366" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="84" cy="383" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="84" y="387" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">5</text>
    <text x="104" y="387" font-size="13" font-weight="700" fill="#1a1a1a">Objetos</text>
    <text x="104" y="399" font-size="10" fill="#6c757d">el sistema en un momento dado, con datos</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="406" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="84" cy="423" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="84" y="427" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">6</text>
    <text x="104" y="427" font-size="13" font-weight="700" fill="#1a1a1a">Paquetes</text>
    <text x="104" y="439" font-size="10" fill="#6c757d">niveles de un sistema; importación y fusión</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="446" width="410" height="30" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="84" cy="461" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="84" y="465" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">7</text>
    <text x="104" y="465" font-size="13" font-weight="700" fill="#1a1a1a">Perfil</text>
    <text x="104" y="476" font-size="10" fill="#6c757d">extensiones del lenguaje; estereotipos</text>
  </g>

  <!-- Panel comportamiento -->
  <rect x="500" y="120" width="470" height="360" rx="12" fill="#ffffff" stroke="#2c4a8a" stroke-width="2"></rect>
  <rect x="500" y="120" width="470" height="46" rx="12" fill="#2c4a8a"></rect>
  <rect x="500" y="148" width="470" height="18" fill="#2c4a8a"></rect>
  <text x="735" y="149" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">COMPORTAMIENTO · 7</text>
  <text x="735" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-style="italic" fill="#6c757d">Aspectos dinámicos del sistema</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="530" y="206" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="554" cy="223" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="554" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">1</text>
    <text x="574" y="227" font-size="13" font-weight="700" fill="#1a1a1a">Casos de uso</text>
    <text x="574" y="239" font-size="10" fill="#6c757d">funcionalidad y sus actores</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="530" y="246" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="554" cy="263" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="554" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">2</text>
    <text x="574" y="267" font-size="13" font-weight="700" fill="#1a1a1a">Actividades</text>
    <text x="574" y="279" font-size="10" fill="#6c757d">flujos de trabajo de negocio u operativos</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="530" y="286" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="554" cy="303" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="554" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">3</text>
    <text x="574" y="307" font-size="13" font-weight="700" fill="#1a1a1a">Máquina de estados</text>
    <text x="574" y="319" font-size="10" fill="#6c757d">objetos que cambian de comportamiento</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="530" y="326" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="554" cy="343" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="554" y="347" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">4</text>
    <text x="574" y="347" font-size="13" font-weight="700" fill="#1a1a1a">Secuencia</text>
    <text x="574" y="359" font-size="10" fill="#6c757d">objetos que interactúan en el tiempo</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="530" y="366" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="554" cy="383" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="554" y="387" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">5</text>
    <text x="574" y="387" font-size="13" font-weight="700" fill="#1a1a1a">Comunicación</text>
    <text x="574" y="399" font-size="10" fill="#6c757d">similar a secuencia, foco en mensajes</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="530" y="406" width="410" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="554" cy="423" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="554" y="427" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">6</text>
    <text x="574" y="427" font-size="13" font-weight="700" fill="#1a1a1a">Panorama de interacciones</text>
    <text x="574" y="439" font-size="10" fill="#6c757d">secuencia en la que actúan las interacciones</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="530" y="446" width="410" height="30" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"></rect>
    <circle cx="554" cy="461" r="10" fill="#eef1f8" stroke="#2c4a8a" stroke-width="1.5"></circle>
    <text x="554" y="465" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a8a">7</text>
    <text x="574" y="465" font-size="13" font-weight="700" fill="#1a1a1a">Temporización</text>
    <text x="574" y="476" font-size="10" fill="#6c757d">comportamiento en un período de tiempo</text>
  </g>
</svg>
